<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <h1>Ejercicio 2</h1>
    <h2>Listado de personas</h2>
    <div id="contenedor"></div>

    <script>
        const personas = [
            { codigo: 1, dni: "4455544X", Nombre: "Juan López López", edad: 18 },
            { codigo: 2, dni: "7778888X", Nombre: "Luis Mateo López", edad: 25 },
            { codigo: 3, dni: "6654545M", Nombre: "Pedro Guitierrez López", edad: 41 },
            { codigo: 4, dni: "9998897X", Nombre: "María Guitierrez López", edad: 32 }
        ];

        const contenedor = document.getElementById("contenedor");

        // Crear la tabla
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");

        // Crear encabezados
        const headers = ["Código", "DNI", "Nombre", "Edad"];
        const trHead = document.createElement("tr");
        headers.forEach(text => {
            const th = document.createElement("th");
            th.textContent = text;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);
        table.appendChild(thead);

        // Rellenar datos
        personas.forEach(p => {
            const tr = document.createElement("tr");

            // Orden de las propiedades según los encabezados
            const datos = [p.codigo, p.dni, p.Nombre, p.edad];

            datos.forEach(dato => {
                const td = document.createElement("td");
                td.textContent = dato;
                tr.appendChild(td);
            });

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        contenedor.appendChild(table);
    </script>
</body>

</html>
