<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card-logo" id="cardLogo">VISA</div>
        
        <form id="cardForm" novalidate>
            
            <label for="cardNumber">Número de Tarjeta</label>
            <div class="input-group">
                <input type="text" id="cardNumber" placeholder="#### #### #### ####" maxlength="19" required>
                <span class="error-message" id="errorCardNumber"></span>
            </div>
            
            <label for="cardName">Nombre Completo</label>
            <div class="input-group">
                <input type="text" id="cardName" placeholder="FULL NAME" required>
                <span class="error-message" id="errorCardName"></span>
            </div>

            <div class="input-row">
                <div class="input-group expiration-group">
                    <label for="expiryDate">Fecha de Vencimiento</label>
                    <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                    <span class="error-message" id="errorExpiryDate"></span>
                </div>

                <div class="input-group cvv-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                    <span class="error-message" id="errorCVV"></span>
                </div>
            </div>

            <button type="submit" class="submit-btn" disabled>Submit</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
