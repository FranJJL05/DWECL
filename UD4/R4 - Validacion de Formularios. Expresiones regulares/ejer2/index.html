<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Registro de Usuario</h1>
    <form id="registroForm">

        <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-nombre"></span>
        </div>

        <div class="campo">
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-apellidos"></span>
        </div>

        <div class="campo">
            <label for="dni">DNI (8 dígitos + 1 letra):</label>
            <input type="text" id="dni" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-dni"></span>
        </div>

        <div class="campo">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-telefono"></span>
        </div>

        <div class="campo">
            <label for="email">Email:</label>
            <input type="email" id="email" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-email"></span>
        </div>

        <div class="campo">
            <label for="usuario">Nombre de Usuario:</label>
            <input type="text" id="usuario" required onblur="validarCampo(this)">
            <span class="error-msg" id="error-usuario"></span>
        </div>

        <button type="submit">Registrarse</button>

    </form>

    <script src="main.js"></script>
</body>
</html>
